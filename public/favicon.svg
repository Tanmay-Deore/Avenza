<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Charcoal Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#20211E" stroke="#42443C" stroke-width="1.5"/>
  
  <!-- Subtle Dial Ring -->
  <circle cx="32" cy="32" r="17" stroke="#8495B8" stroke-opacity="0.38" stroke-width="1.2" stroke-dasharray="2 2"/>
  
  <!-- Compass Needle Rose -->
  <!-- North (Gold + Cream) -->
  <polygon points="32,8 37,27 32,32" fill="#D4B56B" />
  <polygon points="32,8 27,27 32,32" fill="#F8F4EC" />
  
  <!-- East (Light Slate + Slate Blue) -->
  <polygon points="56,32 37,27 32,32" fill="#A2B3D4" />
  <polygon points="56,32 37,37 32,32" fill="#8495B8" />
  
  <!-- South (Slate Blue + Deep Slate) -->
  <polygon points="32,56 37,37 32,32" fill="#8495B8" />
  <polygon points="32,56 27,37 32,32" fill="#4F6288" />
  
  <!-- West (Linen + Cream) -->
  <polygon points="8,32 27,37 32,32" fill="#D8CCB9" />
  <polygon points="8,32 27,27 32,32" fill="#F8F4EC" />
  
  <!-- Center Pivot Hub -->
  <circle cx="32" cy="32" r="4.2" fill="#D4B56B" />
  <circle cx="32" cy="32" r="2.8" fill="#20211E" />
  <circle cx="32" cy="32" r="1.2" fill="#F8F4EC" />
</svg>